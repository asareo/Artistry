name: Keep Supabase & Render Active

on:
  schedule:
    # Runs every 2 days at 00:00 UTC to ensure Supabase never auto-pauses
    - cron: '0 0 */2 * *'
  workflow_dispatch: # Allows manual trigger from GitHub Actions tab

jobs:
  keepalive:
    name: Supabase & Render Keepalive
    runs-on: ubuntu-latest
    steps:
      - name: Ping Artistry API (Queries Supabase & Wakes Render)
        run: |
          echo "Sending keepalive request to Artistry API..."
          HTTP_STATUS=$(curl -s -o response.json -w "%{http_code}" --max-time 30 "https://artistry-wsnw.onrender.com/api/feature/today")
          echo "HTTP Status: $HTTP_STATUS"
          if [ "$HTTP_STATUS" -ge 200 ] && [ "$HTTP_STATUS" -lt 400 ]; then
            echo "Success! Artistry API responded and Supabase query executed."
          else
            echo "Warning: API returned HTTP $HTTP_STATUS"
            exit 1
          fi
